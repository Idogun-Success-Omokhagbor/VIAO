name: iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "IOS/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Simulator App (Release, unsigned)
        run: |
          xcodebuild \
            -project "IOS/Viao/Viao.xcodeproj" \
            -scheme "Viao" \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify Simulator App
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/Viao.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Expected simulator app not found at: $APP_PATH"
            find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 3 -type d || true
            exit 1
          fi

      - name: Archive (Release, unsigned)
        run: |
          xcodebuild \
            -project "IOS/Viao/Viao.xcodeproj" \
            -scheme "Viao" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Viao.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Upload Simulator Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Viao-Release-simulator-app
          path: ${{ runner.temp }}/DerivedData/Build/Products/Release-iphonesimulator/Viao.app
          if-no-files-found: error

      - name: Upload Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Viao-Release-xcarchive
          path: ${{ runner.temp }}/Viao.xcarchive
          if-no-files-found: error
